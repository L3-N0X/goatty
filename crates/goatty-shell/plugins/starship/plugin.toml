# Built into goatty (crates/goatty-shell/plugins/): always available, turned
# off rather than uninstalled. Same format as registry plugins (docs/plugins.md).
schema = 1
id = "starship"
name = "Starship"
version = "1.0.0"
summary = "A fast, informative prompt"
description = """
Starship shows the directory, the git branch and status, how long the last command took and more, without slowing the shell down. Its look follows goatty's prompt settings (Settings → Prompt) unless you prefer your own ~/.config/starship.toml. Turned off, goatty shows a small built-in prompt."""
publisher = "goatty"
homepage = "https://starship.rs"
license = "ISC"
category = "prompt"
keywords = ["prompt", "git"]

[[package]]
id = "starship"
version = "1.27.0"
bin = ["starship"]

[[package.asset]]
target = "x86_64-linux"
url = "https://github.com/starship/starship/releases/download/v1.27.0/starship-x86_64-unknown-linux-musl.tar.gz"
sha256 = "10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89"
size = 5215016

[[package.asset]]
target = "aarch64-linux"
url = "https://github.com/starship/starship/releases/download/v1.27.0/starship-aarch64-unknown-linux-musl.tar.gz"
sha256 = "341f5cbf24699fa0b27ec88965ad25f862ea09e15d35a543fd6ffdff1d2aa00d"
size = 4776202

[[setting]]
id = "prefer_user_config"
label = "Use my own starship.toml"
help = "Use ~/.config/starship.toml (or $STARSHIP_CONFIG) when it exists, instead of goatty's prompt settings."
type = "bool"
default = false

[zsh]
init = "zsh/init.zsh"
load = "prompt"

[permissions]
binaries = "Starship is a program: unless it's already installed, goatty downloads its official release from GitHub."
shell-code = "Points Starship at goatty's generated config and runs `starship init zsh`, which sets the prompt."
