# Built into goatty (crates/goatty-shell/plugins/): always available, turned
# off rather than uninstalled. Same format as registry plugins (docs/plugins.md).
schema = 1
id = "atuin"
name = "Atuin"
version = "1.0.0"
summary = "Searchable shell history on Ctrl+R"
description = """
Atuin keeps your history in a database with each command's directory, exit status and duration, and opens a full-screen search on Ctrl+R: filter by this directory, this session or everywhere. Syncing history between machines is optional and stays off until you run `atuin login`."""
publisher = "goatty"
homepage = "https://atuin.sh"
license = "MIT"
keywords = ["history", "search", "ctrl-r"]

[[package]]
id = "atuin"
version = "18.24.2"
bin = ["atuin"]

[[package.asset]]
target = "x86_64-linux"
url = "https://github.com/atuinsh/atuin/releases/download/v18.24.2/atuin-x86_64-unknown-linux-musl.tar.gz"
sha256 = "311cd1ba4b8be27de7071dbcae1c95ff4c2b38aeec82d557707b6b832bfceddf"
size = 20351592
root = "atuin-x86_64-unknown-linux-musl"

[[package.asset]]
target = "aarch64-linux"
url = "https://github.com/atuinsh/atuin/releases/download/v18.24.2/atuin-aarch64-unknown-linux-musl.tar.gz"
sha256 = "9addf06ece26e68e842489cefa33e81860c288da373538986ea58c23eccb4f14"
size = 19129327
root = "atuin-aarch64-unknown-linux-musl"

[[setting]]
id = "up_arrow"
label = "Atuin on the Up arrow too"
help = "Off: Up searches plain history by what you typed."
type = "bool"
default = false

[zsh]
init = "zsh/init.zsh"
load = "line-editor"
# fzf binds Ctrl+R as well: load after it so Ctrl+R stays Atuin's.
after = ["fzf"]

[permissions]
binaries = "Atuin is a program: unless it's already installed, goatty downloads its official release from GitHub."
shell-code = "Runs `atuin init zsh`, which records each command and binds Ctrl+R (and Up, when that's on)."
network = "Only if you set up Atuin's sync yourself (`atuin login`): then it uploads your end-to-end encrypted history to the sync server."
