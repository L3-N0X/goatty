# goatty's default Starship prompt. Used only when you have no
# ~/.config/starship.toml of your own and STARSHIP_CONFIG is unset.
# Generated by goatty and rewritten whenever a session starts: to customise
# it, copy it to ~/.config/starship.toml and edit that copy.
"$schema" = "https://starship.rs/config-schema.json"

# One line per prompt; goatty marks prompts itself (OSC 133).
add_newline = false
# Never let a slow module (e.g. a huge git repo) hold up the prompt for long.
command_timeout = 500

[directory]
truncation_length = 4
truncation_symbol = "…/"

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
