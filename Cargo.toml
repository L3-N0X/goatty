[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goatty-dev/goatty"
publish = false

[workspace.dependencies]
# Terminal core — pinned exactly; API still evolving (see plan §13).
rio-vt = { version = "=0.5.29", default-features = false }
portable-pty = "0.9.0"
# GPUI from Zed main, pinned. Bump deliberately: `ZED_REV` below + `cargo update -p gpui`.
# (crates.io gpui 0.2.2 never recreates its Vulkan swapchain after
# VK_ERROR_OUT_OF_DATE_KHR, which froze the window on niri/Wayland.)
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", features = ["wayland", "x11"] }
parking_lot = "0.13"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_bytes = "0.11"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
flume = "0.12"
# Fast byte search (goatty-term: OSC 133 marks in the output stream).
memchr = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
serde_json = "1"
# Settings documents: report the path of an invalid value.
serde_path_to_error = "0.1"
# Settings preview: diffs of generated shell config.
similar = "3"
# Managed tool installs (goatty-shell): verify + unpack release archives.
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
# Plugins (goatty-plugin): TOML manifests, version requirements, signed registry indexes.
toml = "1.1"
semver = "1"
ed25519-dalek = "3"

goatty-term = { path = "crates/goatty-term" }
goatty-proto = { path = "crates/goatty-proto" }
goatty-client = { path = "crates/goatty-client" }
goatty-config = { path = "crates/goatty-config" }
goatty-daemon = { path = "crates/goatty-daemon" }
goatty-shell = { path = "crates/goatty-shell" }
goatty-plugin = { path = "crates/goatty-plugin" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Terminal parsing/rendering is unusable at opt-level 0; keep deps fast.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
